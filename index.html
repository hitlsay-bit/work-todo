    var i = -1;
    for (var j = 0; j < state.recurring.length; j++) if (state.recurring[j].id === id) { i = j; break; }
    if (i < 0) return;
    var r = state.recurring.splice(i, 1)[0];
    save();
    render();
    refreshSheet('정기 업무', recurringHTML());
    showToast('‘' + r.title + '’ 정기 업무를 삭제했어요', function () {
      state.recurring.splice(Math.min(i, state.recurring.length), 0, r);
      save(); render();
      if (!$('#sheetWrap').hidden) refreshSheet('정기 업무', recurringHTML());
    });
  }

  function applyAccountingPreset() {
    var addedP = 0, addedR = 0;
    PRESET_AREAS.forEach(function (a) {
      var hit = null;
      state.projects.forEach(function (p) { if (p.name === a[0]) hit = p; });
      if (!hit) { state.projects.push({ id: uid('p'), name: a[0], color: a[1] }); addedP++; }
    });
    PRESET_RULES.forEach(function (src) {
      if (state.recurring.some(function (r) { return r.title === src.title; })) return;
      var pid = null;
      state.projects.forEach(function (p) { if (p.name === src.area) pid = p.id; });
      state.recurring.push(newRule(src.title, {
        projectId: pid, kind: src.kind, day: src.day,
        month: src.month || 3, months: src.months || [], lead: src.lead || 0
      }));
      addedR++;
    });
    save();
    var made = syncRecurring(todayKey());
    render();
    refreshSheet('정기 업무', recurringHTML());
    if (!addedP && !addedR) showToast('이미 회계 기본 세트가 들어 있어요');
    else showToast('회계 정기 업무 ' + addedR + '개를 불러왔어요' + (made ? ' · 오늘 ' + made + '건 만들었어요' : ''));
  }

  function onRecChange(id, el) {
    var r = recById(id);
    if (!r) return;
    var v = el.value;
    if (el.classList.contains('rtitle')) {
      r.title = cleanNote(v, 80, true) || '정기 업무';
      if (v !== r.title) el.value = r.title;
      save();
      return;
    }
    if (el.classList.contains('rproj')) r.projectId = v || null;
    else if (el.classList.contains('rkind')) {
      r.kind = (v === 'quarterly' || v === 'yearly') ? v : 'monthly';
      if (r.kind === 'quarterly' && r.months.length !== 4) r.months = [1, 4, 7, 10];
    }
    else if (el.classList.contains('rmonths')) r.months = v.split(',').map(Number).filter(function (n) { return n >= 1 && n <= 12; });
    else if (el.classList.contains('rmonth')) r.month = Math.min(12, Math.max(1, numOr(v, 3)));
    else if (el.classList.contains('rday')) r.day = Math.min(31, Math.max(0, numOr(v, 0)));
    else if (el.classList.contains('rlead')) r.lead = Math.min(30, Math.max(0, numOr(v, 0)));
    else if (el.classList.contains('ract')) r.active = !!el.checked;
    else return;
    save();
    var made = syncRecurring(todayKey());
    render();
    refreshSheet('정기 업무', recurringHTML());
    if (made) showToast('정기 업무 ' + made + '건을 만들었어요');
  }

  /* ── projects ── */
  function addProject(name, color) {
    state.projects.push({ id: uid('p'), name: name.slice(0, 20), color: color });
    save();
    render();
  }
  function deleteProject(id) {
    var i = -1;
    for (var j = 0; j < state.projects.length; j++) if (state.projects[j].id === id) { i = j; break; }
    if (i < 0) return;
    var p = state.projects.splice(i, 1)[0];
    var notes = (state.career && state.career[p.id]) ? state.career[p.id] : null;
    if (notes) delete state.career[p.id];
    var affected = [];
    Object.keys(state.tasks).forEach(function (k) {
      (state.tasks[k] || []).forEach(function (t) { if (t.projectId === p.id) { t.projectId = null; affected.push(t); } });
    });
    if (ui.project === id) ui.project = 'all';
    if (ui.addProject === id) ui.addProject = null;
    save();
    render();
    refreshSheet('프로젝트', projectsHTML());
    showToast('‘' + p.name + '’ 프로젝트를 삭제했어요', function () {
      state.projects.splice(Math.min(i, state.projects.length), 0, p);
      affected.forEach(function (t) { t.projectId = p.id; });
      if (notes) { if (!state.career) state.career = {}; state.career[p.id] = notes; }
      save(); render();
      if (!$('#sheetWrap').hidden) refreshSheet('프로젝트', projectsHTML());
    });
  }

  /* ── 경력기술서 ── */
  var CNONE = 'none';
  var PERIOD_OPTS = [['all', '전체'], ['m1', '최근 1개월'], ['m3', '최근 3개월'], ['year', '올해'], ['custom', '직접 선택']];
  var careerSaveTimer = 0;

  function careerState() {
    if (!ui.career) ui.career = { period: 'all', start: '', end: '', project: 'all', includeUndone: false };
    return ui.career;
  }
  function dot(k) { return k ? k.slice(0, 4) + '.' + k.slice(5, 7) + '.' + k.slice(8, 10) : ''; }
  function mdDot(k) { return k ? k.slice(5, 7) + '.' + k.slice(8, 10) : ''; }

  function careerGet(pid) {
    var e = state.career && state.career[pid];
    if (!e || typeof e !== 'object') return { role: '', impact: '', start: null, end: null, ongoing: false };
    return { role: e.role || '', impact: e.impact || '', start: e.start || null, end: e.end || null, ongoing: !!e.ongoing };
  }
  function careerEnsure(pid) {
    if (!state.career) state.career = {};
    var e = state.career[pid];
    if (!e || typeof e !== 'object') {
      e = { role: '', impact: '', start: null, end: null, ongoing: false };
      state.career[pid] = e;
    }
    if (typeof e.role !== 'string') e.role = '';
    if (typeof e.impact !== 'string') e.impact = '';
    e.start = isoOrNull(e.start);
    e.end = isoOrNull(e.end);
    e.ongoing = !!e.ongoing;
    return e;
  }
  function pruneCareer(pid) {
    if (state.career && state.career[pid]) {
      var e = state.career[pid];
      if (!e.role && !e.impact && !e.start && !e.end && !e.ongoing) delete state.career[pid];
    }
  }

  /* 선택한 기간 → {start, end} (null이면 제한 없음) */
  function careerWindow() {
    var c = careerState(), t = today();
    if (c.period === 'custom') {
      var a = isoOrNull(c.start), b = isoOrNull(c.end);
      if (a && b && a > b) { var tmp = a; a = b; b = tmp; }
      return { start: a, end: b };
    }
    if (c.period === 'm1' || c.period === 'm3') {
      var n = c.period === 'm1' ? 1 : 3;
      var st = new Date(t.getFullYear(), t.getMonth() - n, t.getDate() + 1);
      return { start: ymd(st), end: ymd(t) };
    }
    if (c.period === 'year') {
      return { start: ymd(new Date(t.getFullYear(), 0, 1)), end: ymd(new Date(t.getFullYear(), 11, 31)) };
    }
    return { start: null, end: null };
  }

  /* 같은 제목·같은 정기 업무를 한 줄로 묶어 수행 횟수와 기간을 요약한다 */
  function oneLine(s) { return String(s == null ? '' : s).replace(/\s+/g, ' ').trim(); }
  function monDot(k) { return k ? k.slice(0, 4) + '.' + k.slice(5, 7) : ''; }
  function careerItems(arr) {
    var map = {}, order = [];
    arr.forEach(function (o) {
      var k = o.t.recurringId ? 'r:' + o.t.recurringId : 't:' + normTitle(o.t.title);
      if (!map[k]) {
        map[k] = { key: k, title: o.t.title, count: 0, first: o.date, last: o.date,
                   recurring: !!o.t.recurringId, undone: 0, items: [] };
        order.push(k);
      }
      var g = map[k];
      g.count++;
      g.title = o.t.title;
      if (o.date < g.first) g.first = o.date;
      if (o.date > g.last) g.last = o.date;
      if (!o.t.done) g.undone++;
      g.items.push(o);
    });
    return order.map(function (k) {
      var g = map[k];
      g.single = !g.recurring && g.count === 1;
      return g;
    });
  }

  /* 기간·프로젝트·완료 조건에 맞는 업무를 프로젝트별로 묶는다 */
  function careerGroups() {
    var w = careerWindow(), c = careerState();
    var buckets = {};
    Object.keys(state.tasks).sort().forEach(function (k) {
      if (w.start && k < w.start) return;
      if (w.end && k > w.end) return;
      (state.tasks[k] || []).forEach(function (t) {
        if (!t.done && !c.includeUndone) return;
        var gid = (t.projectId && projById(t.projectId)) ? t.projectId : CNONE;
        if (c.project !== 'all' && c.project !== gid) return;
        if (!buckets[gid]) buckets[gid] = [];
        buckets[gid].push({ t: t, date: k });
      });
    });
    var seq = [];
    state.projects.forEach(function (p) { if (buckets[p.id]) seq.push(p.id); });
    if (buckets[CNONE]) seq.push(CNONE);
    return seq.map(function (id) {
      var arr = buckets[id].slice().sort(function (a, b) {
        if (a.date !== b.date) return a.date < b.date ? -1 : 1;
        return (a.t.createdAt || 0) - (b.t.createdAt || 0);
      });
      var p = projById(id), e = careerGet(id);
      var first = arr[0].date, last = arr[arr.length - 1].date;
      var done = 0;
      arr.forEach(function (o) { if (o.t.done) done++; });
      var lines = careerItems(arr);
      return {
        id: id,
        name: p ? p.name : '프로젝트 없음',
        color: p ? p.color : 'slate',
        items: arr,
        lines: lines,
        reps: lines.filter(function (x) { return !x.single; }),
        ones: lines.filter(function (x) { return x.single; }),
        repCount: lines.reduce(function (n, x) { return x.single ? n : n + x.count; }, 0),
        autoStart: first,
        autoEnd: last,
        start: e.start || first,
        end: e.end || last,
        override: !!(e.start || e.end),
        ongoing: !!e.ongoing,
        done: done,
        undone: arr.length - done,
        role: e.role,
        impact: e.impact
      };
    });
  }

  function careerText() {
    var groups = careerGroups();
    var first = null, last = null, done = 0, undone = 0;
    groups.forEach(function (g) {
      if (!first || g.start < first) first = g.start;
      if (!last || g.end > last) last = g.end;
      done += g.done;
      undone += g.undone;
    });
    var L = [];
    L.push('# 경력기술서 초안');
    L.push('');
    var bits = [];
    if (first) bits.push('기간 ' + dot(first) + ' ~ ' + dot(last));
    bits.push('프로젝트 ' + groups.length + '개');
    bits.push('완료 업무 ' + done + '건' + (undone ? ' · 진행 중 ' + undone + '건' : ''));
    if (groups.length) L.push('> 기록 ' + bits.join(' · '));
    L.push('');
    if (!groups.length) {
      L.push('선택한 조건에 해당하는 업무가 없습니다.');
      return L.join('\n') + '\n';
    }
    groups.forEach(function (g, i) {
      L.push('## ' + (i + 1) + '. ' + g.name);
      L.push('');
      L.push('- 수행 기간: ' + dot(g.start) + ' ~ ' + (g.ongoing ? '진행중(상시)' : dot(g.end)));
      if (g.role) L.push('- 담당 역할: ' + g.role.replace(/\s+/g, ' ').trim());
      if (g.reps.length) {
        L.push('- 정기·반복 업무 (' + g.reps.length + '건 · 총 ' + g.repCount + '회)');
        g.reps.forEach(function (x) {
          L.push('  - ' + oneLine(x.title) + ' · 총 ' + x.count + '회 (' + monDot(x.first) + ' ~ ' + monDot(x.last) + ')');
        });
      }
      if (g.ones.length) {
        L.push('- 주요 수행 업무 (' + g.ones.length + '건)');
        g.ones.forEach(function (x) {
          var o = x.items[0];
          L.push('  - ' + oneLine(o.t.title) + ' (' + dot(o.date) + (o.t.done ? '' : ' · 진행 중') + ')');
        });
      }
      if (g.impact) {
        L.push('');
        L.push('- 성과·기여도·규모');
        g.impact.split(/\r?\n/).forEach(function (line) {
          var v = line.replace(/\s+/g, ' ').trim();
          if (v) L.push('  - ' + v);
        });
      }
      L.push('');
    });
    return L.join('\n').replace(/\n{3,}/g, '\n\n').trim() + '\n';
  }

  function groupHTML(g) {
    var h = '<section class="cgrp p-' + g.color + '" data-gid="' + esc(g.id) + '">';
    h += '<div class="cgrp-hd"><i class="cdot"></i><span class="cgrp-name">' + esc(g.name) + '</span>' +
      '<span class="cgrp-meta">' + (g.undone ? '완료 ' + g.done + ' · 진행 ' + g.undone : g.done + '건') + '</span></div>';
    h += '<div class="cgrp-per">' +
      '<input type="date" class="cst" data-gid="' + esc(g.id) + '" value="' + g.start + '" aria-label="' + esc(g.name) + ' 표시 시작일">' +
      '<span>~</span>' +
      '<input type="date" class="cen" data-gid="' + esc(g.id) + '" value="' + g.end + '" aria-label="' + esc(g.name) + ' 표시 종료일">' +
      '<button type="button" class="congoing' + (g.ongoing ? ' on' : '') + '" data-act="c-ongoing" data-gid="' + esc(g.id) + '" aria-pressed="' + (g.ongoing ? 'true' : 'false') + '" title="상시 진행 중으로 표시">상시</button>' +
      '<button type="button" class="creset" data-act="c-reset" data-gid="' + esc(g.id) + '"' + (g.override ? '' : ' hidden') + '>자동</button>' +
      '</div>';
    h += '<div class="crow"><span class="clab" aria-hidden="true">담당 역할</span><input type="text" class="crole" data-gid="' + esc(g.id) + '" maxlength="80" autocomplete="off" aria-label="' + esc(g.name) + ' 담당 역할" placeholder="예: 월결산·세무신고 전담" value="' + esc(g.role) + '"></div>';
    h += '<div class="crow top"><span class="clab" aria-hidden="true">성과·규모</span><textarea class="cimp" data-gid="' + esc(g.id) + '" rows="2" maxlength="600" aria-label="' + esc(g.name) + ' 성과·규모 메모" placeholder="예: 월 평균 전표 450건 처리, 가산세 0건, 결산 소요 D+5 → D+3 단축">' + esc(g.impact) + '</textarea></div>';
    h += '<ul class="ctasks">';
    g.lines.forEach(function (x) {
      if (x.single) {
        var o = x.items[0];
        h += '<li>' + esc(o.t.title) + (o.t.done ? '' : ' <i>진행 중</i>') + '<em>' + mdDot(o.date) + '</em></li>';
      } else {
        h += '<li class="agg"><span class="cnm">' + esc(x.title) + '</span>' +
          '<i class="rt">' + (x.recurring ? '정기' : '반복') + '</i>' +
          '<em>총 ' + x.count + '회 · ' + mdDot(x.first) + '~' + mdDot(x.last) + '</em></li>';
      }
    });
    h += '</ul></section>';
    return h;
  }

  function renderCareer() {
    var c = careerState();
    if (c.project !== 'all' && c.project !== CNONE && !projById(c.project)) c.project = 'all';

    var seg = $('#careerSeg');
    seg.innerHTML = '';
    PERIOD_OPTS.forEach(function (p) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'seg-b' + (c.period === p[0] ? ' on' : '');
      b.textContent = p[1];
      b.setAttribute('data-period', p[0]);
      b.setAttribute('aria-pressed', c.period === p[0] ? 'true' : 'false');
      b.addEventListener('click', function () {
        careerState().period = p[0];
        renderCareer();
      });
      seg.appendChild(b);
    });

    var range = $('#careerRange');
    range.hidden = c.period !== 'custom';
    if (!range.hidden) {
      $('#cStart').value = c.start || '';
      $('#cEnd').value = c.end || '';
    }

    var sel = $('#careerProject');
    var opts = '<option value="all">전체 프로젝트</option>';
    state.projects.forEach(function (p) {
      opts += '<option value="' + esc(p.id) + '">' + esc(p.name) + '</option>';
    });
    opts += '<option value="' + CNONE + '">프로젝트 없음</option>';
    sel.innerHTML = opts;
    sel.value = c.project;
    if (sel.value !== c.project) { c.project = 'all'; sel.value = 'all'; }
    $('#cInclude').checked = !!c.includeUndone;

    var groups = careerGroups();
    var first = null, last = null, tot = 0, done = 0;
    groups.forEach(function (g) {
      if (!first || g.start < first) first = g.start;
      if (!last || g.end > last) last = g.end;
      tot += g.items.length;
      done += g.done;
    });

    var html = '';
    if (!groups.length) {
      html += '<p class="cnone">선택한 조건에 해당하는 업무가 없어요.<br>' +
        (c.includeUndone ? '기간을 넓히거나 다른 프로젝트를 골라 보세요.' : '기간을 넓히거나 ‘미완료 포함’을 켜 보세요.') + '</p>';
    } else {
      html += '<p class="csum"><b>' + groups.length + '개 프로젝트</b> · 업무 <b>' + tot + '건</b>' +
        (done !== tot ? '(완료 ' + done + ')' : '') + ' · ' + dot(first) + ' ~ ' + dot(last) + '</p>';
    }
    groups.forEach(function (g) { html += groupHTML(g); });
    html += '<div class="cblock"><div class="cblock-hd"><b>초안 미리보기</b><span>' +
      (groups.length ? '복사해서 이력서·AI에 붙여넣으세요' : '조건을 바꾸면 바로 만들어져요') +
      '</span></div><pre class="draft" id="careerDraft"></pre></div>';

    $('#careerBody').innerHTML = html;
    Array.prototype.forEach.call(document.querySelectorAll('.cimp'), autoGrow);
    updateCareerDraft();
  }

  function autoGrow(el) {
    if (!el || el.tagName !== 'TEXTAREA') return;
    el.style.height = 'auto';
    el.style.height = Math.min(Math.max(el.scrollHeight + 2, 40), 190) + 'px';
  }

  function updateCareerDraft() {
    var el = $('#careerDraft');
    if (el) el.textContent = careerText();
  }

  function saveCareerSoon() {
    clearTimeout(careerSaveTimer);
    careerSaveTimer = setTimeout(function () { save(); }, 300);
  }

  function openCareer() {
    careerState();
    var w = $('#careerWrap');
    w.hidden = false;
    renderCareer();
    requestAnimationFrame(function () { w.classList.add('show'); });
  }
  function closeCareer() {
    var w = $('#careerWrap');
    if (!w || w.hidden) return;
    clearTimeout(careerSaveTimer);
    save();
    w.classList.remove('show');
    setTimeout(function () { if (!w.classList.contains('show')) w.hidden = true; }, 220);
  }

  function copyCareer() {
    var text = careerText();
    function ok() { showToast('경력기술서 초안을 복사했어요'); }
    function fallback() {
      try {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '0';
        ta.style.left = '-9999px';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, text.length);
        var done = document.execCommand('copy');
        document.body.removeChild(ta);
        if (done) { ok(); return; }
        showToast('복사하지 못했어요. 미리보기를 길게 눌러 주세요');
      } catch (e) {
        showToast('복사하지 못했어요. 미리보기를 길게 눌러 주세요');
      }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      try {
        navigator.clipboard.writeText(text).then(ok, fallback);
      } catch (e) { fallback(); }
    } else fallback();
  }

  function downloadCareer(ext) {
    var text = careerText();
    var name = '경력기술서-' + todayKey() + '.' + ext;
    var mime = ext === 'md' ? 'text/markdown;charset=utf-8' : 'text/plain;charset=utf-8';
    try {
      var blob = new Blob([text], { type: mime });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = name;
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      setTimeout(function () {
        if (a.parentNode) a.parentNode.removeChild(a);
        URL.revokeObjectURL(url);
      }, 1500);
      showToast(name + ' 파일로 저장했어요');
    } catch (e) {
      showToast('파일을 저장하지 못했어요');
    }
  }

  /* ── viewport ── */
  function syncViewport() {
    var vv = window.visualViewport;
    if (!vv) return;
    var root = document.documentElement.style;
    root.setProperty('--app-h', Math.round(vv.height) + 'px');
    root.setProperty('--app-top', Math.max(0, Math.round(vv.offsetTop)) + 'px');
  }

  /* ── wiring ── */
  function wire() {
    $('#prevBtn').addEventListener('click', function () {
      ui.mode = 'day'; editCancel();
      ui.date = ymd(shift(parse(ui.date) || today(), -1));
      render();
      resetScroll();
    });
    $('#nextBtn').addEventListener('click', function () {
      ui.mode = 'day'; editCancel();
      ui.date = ymd(shift(parse(ui.date) || today(), 1));
      render();
      resetScroll();
    });
    $('#todayBtn').addEventListener('click', function () {
      ui.mode = 'day'; editCancel();
      ui.date = todayKey();
      render();
      resetScroll();
    });
    $('#datePicker').addEventListener('change', function () {
      if (!this.value) return;
      ui.mode = 'day'; editCancel();
      ui.date = this.value;
      render();
      resetScroll();
    });
    $('#dueBanner').addEventListener('click', function () {
      ui.mode = 'due'; editCancel(); render(); resetScroll();
    });

    /* 경력기술서 */
    $('#careerBtn').addEventListener('click', openCareer);
    $('#careerClose').addEventListener('click', closeCareer);
    $('#careerProject').addEventListener('change', function () {
      careerState().project = this.value || 'all';
      renderCareer();
    });
    $('#cInclude').addEventListener('change', function () {
      careerState().includeUndone = !!this.checked;
      renderCareer();
    });
    $('#cStart').addEventListener('change', function () {
      careerState().start = this.value || '';
      renderCareer();
    });
    $('#cEnd').addEventListener('change', function () {
      careerState().end = this.value || '';
      renderCareer();
    });
    $('#careerCopy').addEventListener('click', copyCareer);
    $('#careerSaveMd').addEventListener('click', function () { downloadCareer('md'); });
    $('#careerSaveTxt').addEventListener('click', function () { downloadCareer('txt'); });

    $('#careerBody').addEventListener('input', function (e) {
      var t = e.target;
      if (!t || !t.dataset || !t.dataset.gid) return;
      var gid = t.dataset.gid;
      if (t.classList.contains('crole')) {
        careerEnsure(gid).role = cleanNote(t.value, 80, true);
        updateCareerDraft(); saveCareerSoon();
      } else if (t.classList.contains('cimp')) {
        careerEnsure(gid).impact = cleanNote(t.value, 600, false);
        autoGrow(t);
        updateCareerDraft(); saveCareerSoon();
      }
    });
    $('#careerBody').addEventListener('change', function (e) {
      var t = e.target;
      if (!t || !t.dataset || !t.dataset.gid) return;
      var gid = t.dataset.gid;
      if (t.classList.contains('crole') || t.classList.contains('cimp')) {
        var en = careerEnsure(gid);
        if (t.classList.contains('crole')) en.role = cleanNote(t.value, 80, true);
        else en.impact = cleanNote(t.value, 600, false);
        pruneCareer(gid);
        clearTimeout(careerSaveTimer);
        save();
        updateCareerDraft();
      } else if (t.classList.contains('cst') || t.classList.contains('cen')) {
        var e2 = careerEnsure(gid);
        var v = isoOrNull(t.value) || null;
        if (t.classList.contains('cst')) e2.start = v; else e2.end = v;
        if (e2.start && e2.end && e2.start > e2.end) {
          var tmp = e2.start; e2.start = e2.end; e2.end = tmp;
        }
        clearTimeout(careerSaveTimer);
        save();
        renderCareer();
      }
    });
    $('#careerBody').addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('[data-act]') : null;
      if (!b) return;
      var act = b.dataset.act;
      if (act !== 'c-reset' && act !== 'c-ongoing') return;
      var gid = b.dataset.gid;
      var en = careerEnsure(gid);
      if (act === 'c-reset') { en.start = null; en.end = null; }
      else en.ongoing = !en.ongoing;
      clearTimeout(careerSaveTimer);
      save();
      renderCareer();
    });

    $('#addForm').addEventListener('submit', function (e) { e.preventDefault(); addTask(); });

    $('#carryBtn').addEventListener('click', carryPrev);
    $('#bulkBtn').addEventListener('click', moveAllNext);

    $('#addProjChip').addEventListener('click', function () { openProjectPicker(); });
    function openDate() {
      var inp = $('#addDueInput');
      try { inp.focus({ preventScroll: true }); } catch (e) { }
      try { if (inp.showPicker) { inp.showPicker(); return; } } catch (e) { }
      try { inp.click(); } catch (e) { }
    }
    $('#addDueChip').addEventListener('click', openDate);
    $('#addDueClear').addEventListener('click', function () {
      ui.addDue = '';
      updateAddMeta();
    });
    $('#addDueInput').addEventListener('change', function () {
      ui.addDue = this.value || '';
      updateAddMeta();
    });

    $('#emptyBtn').addEventListener('click', function () {
      [['기획', 'indigo'], ['개발', 'teal'], ['운영', 'amber']].forEach(function (d) {
        var exists = state.projects.some(function (p) { return p.name === d[0]; });
        if (!exists) state.projects.push({ id: uid('p'), name: d[0], color: d[1] });
      });
      save(); render();
      showToast('예시 프로젝트 3개를 추가했어요');
    });

    $('#undoBtn').addEventListener('click', function () {
      var fn = undoFn;
      hideToast();
      if (fn) fn();
    });

    $('#sheetCancel').addEventListener('click', closeSheet);
    $('#sheetBack').addEventListener('click', closeSheet);

    $('#list').addEventListener('click', function (e) {
      var b = e.target.closest('[data-act]');
      if (!b) return;
      var li = b.closest('.task');
      if (!li) return;
      var key = li.dataset.date, id = li.dataset.id;
      var act = b.dataset.act;
      if (act === 'toggle') toggleTask(key, id);
      else if (act === 'edit') startEdit(key, id);
      else if (act === 'more') openRowMenu(key, id);
      else if (act === 'move') moveTaskNext(key, id);
      else if (act === 'goto') { ui.mode = 'day'; ui.date = b.dataset.date; editingKey = null; render(); resetScroll(); }
      else if (act === 'save') saveEdit();
      else if (act === 'cancel') editCancel();
      else if (act === 'clearDue') {
        var dueInp = $('.edue', li);
        if (dueInp) dueInp.value = '';
      }
    });
    $('#list').addEventListener('keydown', function (e) {
      if (!editingKey) return;
      if (e.key === 'Enter') { e.preventDefault(); saveEdit(); }
      else if (e.key === 'Escape') { e.preventDefault(); editCancel(); }
    });

    $('#sheetBody').addEventListener('click', function (e) {
      var b = e.target.closest('[data-act]');
      if (!b) return;
      var act = b.dataset.act;

      if (act === 'r-preset') {
        applyAccountingPreset();
      } else if (act === 'r-del') {
        var rr = b.closest('.rrow');
        if (rr) deleteRecurring(rr.dataset.id);
      } else if (act === 'r-add') {
        var ri = $('#newRecTitle');
        addRecurring(ri ? ri.value : '');
      } else if (act === 'p-palette') {
        var row = b.closest('.prow');
        var pal = row.nextElementSibling;
        if (pal && pal.classList.contains('palette')) {
          pal.hidden = !pal.hidden;
          b.setAttribute('aria-expanded', pal.hidden ? 'false' : 'true');
        }
      } else if (act === 'p-color') {
        var pal = b.closest('.palette');
        var p = pal ? projById(pal.dataset.for) : null;
        if (p) { p.color = b.dataset.color; save(); render(); refreshSheet('프로젝트', projectsHTML()); }
      } else if (act === 'p-del') {
        var row3 = b.closest('.prow');
        deleteProject(row3.dataset.id);
      } else if (act === 'n-palette') {
        newColor = COLORS[(COLORS.indexOf(newColor) + 1) % COLORS.length];
        refreshSheet('프로젝트', projectsHTML());
      } else if (act === 'n-color') {
        newColor = b.dataset.color;
        refreshSheet('프로젝트', projectsHTML());
        var ni = $('#newProjName'); if (ni) ni.focus();
      } else if (act === 'p-add') {
        var inp = $('#newProjName');
        var v = inp ? inp.value.replace(/\s+/g, ' ').trim() : '';
        if (!v) { if (inp) inp.focus(); return; }
        if (state.projects.some(function (x) { return x.name === v; })) { showToast('같은 이름의 프로젝트가 있어요'); return; }
        addProject(v, newColor);
        refreshSheet('프로젝트', projectsHTML());
        var again = $('#newProjName'); if (again) again.focus();
      } else if (act === 'pick') {
        ui.addProject = b.dataset.pid || null;
        if (!ui.addProject && ui.project !== 'all') { /* keep view filter as is */ }
        updateAddMeta();
        closeSheet();
      } else if (act === 'pick-new') {
        refreshSheet('프로젝트', projectsHTML());
        var ni2 = $('#newProjName'); if (ni2) ni2.focus();
      } else if (act === 'menu-edit') {
        var t1 = menuTarget; closeSheet(); if (t1) startEdit(t1.key, t1.id);
      } else if (act === 'menu-move') {
        var t2 = menuTarget; closeSheet(); if (t2) moveTaskNext(t2.key, t2.id);
      } else if (act === 'menu-del') {
        var t3 = menuTarget; closeSheet(); if (t3) deleteTask(t3.key, t3.id);
      }
    });

    $('#sheetBody').addEventListener('keydown', function (e) {
      if (e.key !== 'Enter') return;
      var inp = e.target.closest('#newProjName');
      if (inp) {
        e.preventDefault();
        var add = document.querySelector('[data-act="p-add"]');
        if (add) add.click();
        return;
      }
      var rinp = e.target.closest('#newRecTitle');
      if (rinp) {
        e.preventDefault();
        var radd = document.querySelector('[data-act="r-add"]');
        if (radd) radd.click();
      }
    });

    $('#sheetBody').addEventListener('input', function (e) {
      var t = e.target;
      if (!t || !t.classList || !t.classList.contains('rtitle')) return;
      var row = t.closest ? t.closest('.rrow') : null;
      if (!row) return;
      var r = recById(row.dataset.id);
      if (!r) return;
      r.title = cleanNote(t.value, 80, true) || '정기 업무';
      saveSoon();
    });

    $('#sheetBody').addEventListener('change', function (e) {
      var t = e.target;
      var rrow = t.closest ? t.closest('.rrow') : null;
      if (rrow) { onRecChange(rrow.dataset.id, t); return; }
      var inp = t.closest('.pname');
      if (!inp) return;
      var row = inp.closest('.prow');
      var p = projById(row.dataset.id);
      if (!p) return;
      var v = inp.value.replace(/\s+/g, ' ').trim().slice(0, 20);
      if (!v) { inp.value = p.name; return; }
      if (v === p.name) return;
      p.name = v;
      save(); render();
    });

    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      if ($('#careerWrap') && !$('#careerWrap').hidden) { closeCareer(); return; }
      if (!$('#sheetWrap').hidden) { closeSheet(); return; }
      if (editingKey) { editCancel(); }
    });

    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', syncViewport);
      window.visualViewport.addEventListener('scroll', syncViewport);
    }
    window.addEventListener('resize', syncViewport);
    window.addEventListener('orientationchange', function () { setTimeout(syncViewport, 250); });
  }

  /* ── boot ── */
  function boot() {
    state = load();
    var t = todayKey();
    lastToday = t;
    ui = { date: t, mode: 'day', project: 'all', addProject: null, addDue: '',
           career: { period: 'all', start: '', end: '', project: 'all', includeUndone: false } };
    wire();
    syncViewport();
    render();
    setInterval(function () {
      var now = todayKey();
      if (now !== lastToday) {
        if (ui.date === lastToday) ui.date = now;
        lastToday = now;
        render();
      }
    }, 30000);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
